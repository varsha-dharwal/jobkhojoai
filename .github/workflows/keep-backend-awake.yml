# Render's free plan puts the API to sleep after ~15 minutes without traffic, and the
# first request afterwards takes 30s+. Pinging it every 10 minutes keeps it awake.
# (One always-on free service uses ~744 of the 750 free instance hours per month.)
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        run: curl --silent --show-error --max-time 90 --retry 2 https://jobkhojoai-backend.onrender.com/ > /dev/null
