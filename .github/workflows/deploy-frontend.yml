# Builds the site (pre-rendering every job page from the live API) and deploys it to
# Cloudflare Pages. Runs on pushes to main, every morning, and on demand — so jobs
# posted through the admin panel get their own static page within a day.
#
# One-time setup — repository Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
name: Deploy frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wake the API before pre-rendering
        run: curl --silent --max-time 120 --retry 3 https://jobkhojoai-backend.onrender.com/ > /dev/null || true
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy build/client --project-name=jobkhojoai --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
